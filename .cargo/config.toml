[target.x86_64-unknown-linux-gnu]
rustflags = ["-Z", "threads=4", "-C", "linker=cc", "-C", "link-arg=-B/usr/bin"]

[build]
# Parallel rustc front-end (nightly). Added by build-settings sweep.
rustflags = ["-Z", "threads=4"]
