[package]
edition = "2024"
rust-version = "1.88.0"
name = "keyring"
version = "4.1.4"
authors = ["Daniel Brotsky <dev@brotsky.com>"]
build = false
exclude = [".github"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "All-in-One Rust Keyring"
homepage = "https://github.com/open-source-cooperative/keyring-rs/wiki/Keyring"
readme = "README.md"
keywords = [
    "password",
    "credential",
    "keychain",
    "keyring",
    "cross-platform",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/open-source-cooperative/keyring-rs"

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-gnu",
    "x86_64-linux-android",
    "x86_64-unknown-freebsd",
    "aarch64-apple-darwin",
    "aarch64-apple-ios",
]

[features]
cli = [
    "keyring-core/sample",
    "apple-native-keyring-store/keychain",
    "apple-native-keyring-store/protected",
    "windows-native-keyring-store",
    "zbus-secret-service-keyring-store",
    "dbus-secret-service-keyring-store",
    "linux-keyutils-keyring-store",
    "db-keystore",
]
