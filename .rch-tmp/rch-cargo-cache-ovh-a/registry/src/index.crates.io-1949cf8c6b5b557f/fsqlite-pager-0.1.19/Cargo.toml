[package]
edition = "2024"
rust-version = "1.85"
name = "fsqlite-pager"
version = "0.1.19"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Page cache and journal management"
readme = "README.md"
license-file = "LICENSE"
repository = "https://github.com/Dicklesworthstone/frankensqlite"
resolver = "2"

[features]
default = ["native"]
encryption = [
    "dep:argon2",
    "dep:chacha20poly1305",
]
evalue-eviction = []
fault-injection = ["fsqlite-wal/fault-injection"]
linux-asupersync-uring = ["fsqlite-vfs/linux-asupersync-uring"]
native = [
    "encryption",
    "fsqlite-types/native",
    "fsqlite-vfs/native",
    "fsqlite-wal/native",
]
wasm = [
    "fsqlite-types/wasm",
    "fsqlite-vfs/wasm",
    "fsqlite-wal/wasm",
]

[lib]
name = "fsqlite_pager"
path = "src/lib.rs"

[[test]]
name = "self_alloc_extension_not_conflict"
path = "tests/self_alloc_extension_not_conflict.rs"

[dependencies.argon2]
version = "0.5"
optional = true

[dependencies.blake3]
version = "1.8"

[dependencies.bumpalo]
version = "3"
features = ["collections"]

[dependencies.chacha20poly1305]
version = "0.10"
optional = true

[dependencies.dashmap]
version = "6.2"

[dependencies.foldhash]
version = "0.2.0"

[dependencies.fsqlite-error]
version = "0.1.19"

[dependencies.fsqlite-observability]
version = "0.1.19"

[dependencies.fsqlite-types]
version = "0.1.19"
default-features = false

[dependencies.fsqlite-vfs]
version = "0.1.19"
default-features = false

[dependencies.fsqlite-wal]
version = "0.1.19"
default-features = false

[dependencies.hashbrown]
version = "0.17"
features = ["serde"]

[dependencies.smallvec]
version = "1.15.2"
features = [
    "const_generics",
    "union",
    "const_new",
]

[dependencies.tracing]
version = "0.1"

[dependencies.xxhash-rust]
version = "0.8"
features = ["xxh3"]

[dev-dependencies.asupersync]
version = "0.3.9"
default-features = false

[dev-dependencies.fsqlite-mvcc]
version = ">=0.1.2, <0.2.0"

[dev-dependencies.fsqlite-wal]
version = "0.1.19"

[dev-dependencies.proptest]
version = "1.11"

[dev-dependencies.serde_json]
version = "1.0"
features = ["preserve_order"]

[dev-dependencies.tempfile]
version = "3.27"

[dev-dependencies.tracing-subscriber]
version = "0.3.23"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.parking_lot]
version = "0.12"

