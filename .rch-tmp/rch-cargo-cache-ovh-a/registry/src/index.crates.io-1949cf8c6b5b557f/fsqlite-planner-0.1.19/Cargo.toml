[package]
edition = "2024"
rust-version = "1.85"
name = "fsqlite-planner"
version = "0.1.19"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Query planner: name resolution, WHERE analysis, join ordering"
readme = "README.md"
license-file = "LICENSE"
repository = "https://github.com/Dicklesworthstone/frankensqlite"
resolver = "2"

[features]
decision-log-json = ["dep:serde_json"]
default = ["native"]
native = ["decision-log-json"]
wasm = []

[lib]
name = "fsqlite_planner"
path = "src/lib.rs"

[[test]]
name = "bd_1lsfu_6_decision_contract"
path = "tests/bd_1lsfu_6_decision_contract.rs"

[[test]]
name = "golden_decision_contract_snapshots"
path = "tests/golden_decision_contract_snapshots.rs"

[[test]]
name = "golden_differential_plan_snapshots"
path = "tests/golden_differential_plan_snapshots.rs"

[[test]]
name = "golden_query_plan_snapshots"
path = "tests/golden_query_plan_snapshots.rs"

[[bench]]
name = "oltp_cost_estimation_hot_paths"
path = "benches/oltp_cost_estimation_hot_paths.rs"
harness = false

[[bench]]
name = "plan_cache_hot_paths"
path = "benches/plan_cache_hot_paths.rs"
harness = false

[dependencies.blake3]
version = "1.8"

[dependencies.fsqlite-ast]
version = "0.1.19"

[dependencies.fsqlite-error]
version = "0.1.19"

[dependencies.fsqlite-parser]
version = "0.1.19"

[dependencies.fsqlite-types]
version = "0.1.19"
default-features = false

[dependencies.lru]
version = "0.18"

[dependencies.serde]
version = "1.0"
features = [
    "derive",
    "rc",
]

[dependencies.serde_json]
version = "1.0"
features = ["preserve_order"]
optional = true

[dependencies.tracing]
version = "0.1"

[dependencies.xxhash-rust]
version = "0.8"
features = ["xxh3"]

[dev-dependencies.insta]
version = "1.48"
features = [
    "json",
    "yaml",
]

[dev-dependencies.proptest]
version = "1.11"

[dev-dependencies.serde_json]
version = "1.0"
features = ["preserve_order"]

